services:
  postgres:
    image: postgres:16-alpine
    container_name: finanzapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finanzapp
      POSTGRES_PASSWORD: finanzapp_dev
      POSTGRES_DB: finanzapp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzapp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
